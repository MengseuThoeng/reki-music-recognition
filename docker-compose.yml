services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: music_telegram_bot_api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8082:8081"

  reki-music-bot:
    build: .
    container_name: reki_music_recognition_bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - LOCAL_BOT_API_URL=${LOCAL_BOT_API_URL:-http://telegram-bot-api:8081/bot}
      - SQLITE_DB_PATH=/app/data/reki_music.db
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

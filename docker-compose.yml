services:
  reki-music-bot:
    build: .
    container_name: reki_music_recognition_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SQLITE_DB_PATH=/app/data/reki_music.db
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
